html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #17171a;
	overflow: hidden;
	touch-action: none;
	font-family: 'Jersey 25', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* --- loading screen ------------------------------------------------- */

#loader {
	position: fixed;
	inset: 0;
	background-color: #17171a;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1.5rem;
	opacity: 1;
	transition: opacity 250ms linear;
	z-index: 2;
	overflow-y: auto;
}

#loader.fade-out {
	opacity: 0;
}

#loader.hidden {
	display: none;
}

.label {
	font-size: 1.1rem;
	letter-spacing: 0.12em;
	text-transform: uppercase;
	color: #8a8a96;
}

/* Sits in the loader, so it leaves with it once the world is up. */
#brand {
	position: absolute;
	top: 1rem;
	left: 1.25rem;
	font-size: 1.5rem;
	letter-spacing: 0.06em;
	line-height: 1.1;
	color: #d8d8e0;
}

#brand .brand-site {
	display: block;
	font-size: 1.15rem;
	color: #8a8a96;
}

/* Phone screens have no room beside the creator, so the corner name would land
   on top of it. Drop it there. */
@media (max-width: 600px), (max-height: 640px) {
	#brand {
		display: none;
	}
}

#prompt {
	font-size: 1.5rem;
	letter-spacing: 0.06em;
	color: #8a8a96;
	text-align: center;
	line-height: 1.2;
	max-width: min(320px, 88vw);
}

#prompt em {
	font-style: normal;
	color: #d8d8e0;
}

/* --- character creator ------------------------------------------------ */

#creator {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 1.25rem;
	width: min(320px, 88vw);
	font-size: 1.15rem;
	letter-spacing: 0.1em;
	text-transform: uppercase;
	padding: 1.5rem 0;
}

/* Once Play is pressed the creator stays exactly where it is; the button turns
   into the indicator and the controls go quiet. Nothing moves, nothing swaps.

   Booting blocks the main thread for over a second, so the pulse must be one the
   compositor can run alone: transform and opacity only. Touching any other
   property (background-color, width, ...) pins the whole animation to the main
   thread, where it would sit frozen for exactly the wait it is meant to cover.
   will-change asks for the layer up front, before the block starts. */
#creator.busy .rows,
#creator.busy #random {
	opacity: 0.3;
	pointer-events: none;
}

#creator.busy #play {
	pointer-events: none;
}

.blocks {
	display: none;
	gap: 6px;
	height: 14px;
	align-items: center;
	justify-content: center;
}

#creator.busy .blocks {
	display: flex;
}

#creator.busy .play-label {
	display: none;
}

.blocks > span {
	width: 10px;
	height: 10px;
	background-color: #17171a;
	opacity: 0.25;
	will-change: transform, opacity;
	animation: block-pulse 1s steps(2, end) infinite;
}

.blocks > span:nth-child(2) { animation-delay: 0.125s; }
.blocks > span:nth-child(3) { animation-delay: 0.25s; }
.blocks > span:nth-child(4) { animation-delay: 0.375s; }

@keyframes block-pulse {
	0%   { opacity: 0.25; transform: translateY(0); }
	50%  { opacity: 1;    transform: translateY(-4px); }
	100% { opacity: 0.25; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
	.blocks > span {
		animation: none;
		opacity: 0.7;
	}
}

#preview {
	width: 144px;
	height: 144px;
	background-color: #26262c;
	image-rendering: pixelated;
	flex: none;
}

.rows {
	display: flex;
	flex-direction: column;
	gap: 0.9rem;
	width: 100%;
}

.row {
	display: flex;
	flex-direction: column;
	gap: 0.4rem;
}

.row-top {
	display: flex;
	align-items: center;
	gap: 0.6rem;
	color: #8a8a96;
}

.row-name {
	flex: 1;
}

.row-count {
	color: #d8d8e0;
	letter-spacing: 0.1em;
}

.swatches {
	display: flex;
	gap: 6px;
	align-items: center;
	flex-wrap: wrap;
}

.swatch {
	width: 18px;
	height: 18px;
	padding: 0;
	border: 1px solid #3a3a42;
	background-clip: padding-box;
	cursor: pointer;
}

.swatch.selected {
	box-shadow: 0 0 0 2px #d8d8e0;
}

.swatch-custom {
	width: 18px;
	height: 18px;
	padding: 0;
	border: 1px solid #3a3a42;
	background-color: #26262c;
	cursor: pointer;
	margin-left: auto;
}

button {
	font: inherit;
	letter-spacing: inherit;
	text-transform: inherit;
	color: #d8d8e0;
	background-color: #26262c;
	border: 1px solid #3a3a42;
	padding: 0.5rem 0.75rem;
	cursor: pointer;
}

button:hover {
	background-color: #3a3a42;
}

.arrow {
	width: 26px;
	padding: 0.25rem 0;
	text-align: center;
}

.actions {
	display: flex;
	gap: 0.75rem;
	width: 100%;
}

#random {
	flex: none;
}

/* Always clickable: pressing Play early just means entering as soon as the
   world is up, rather than sitting on a dead button. */
#play {
	flex: 1;
	color: #17171a;
	background-color: #d8d8e0;
	border-color: #d8d8e0;
}

#play:hover {
	background-color: #ffffff;
}

/* --- failure notice -------------------------------------------------- */

#status-notice {
	position: fixed;
	left: 0;
	right: 0;
	top: 50%;
	transform: translateY(-50%);
	display: none;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-size: 1.15rem;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 3;
}

		shirt: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFAAAAAQCAYAAACBSfjBAAAAAXNSR0IArs4c6QAAAGRJREFUWIXt0UsOgCAMRVFq3P+WnyMHVpCSgonmniH9ppQCAAAAAG+zVkCSLolmzdw/1fs6z/fZow3O994i2foZajtI0orZ28xmvd+L5qzaITL76ci12O2Aow1G4tGcjMz+wPcchJ48Dr2eG4AAAAAASUVORK5CYII=',
		shirtskin: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPAAAAAQCAYAAAAoEfIQAAAAAXNSR0IArs4c6QAAAIBJREFUaIHt1MENgCAMBVD3H8F13McV9OSFGAXbCJr3jgaEfqDTBAAAAAAAAAAAwA+ty7zVfOOc/GLkFyTAOHnl+UyWNRt9o5jIA74aF62vtfbejejJWpn1l3Pu5vfO60zGmbf8qxzzav0jNIDsC9hTrwv9tZwOIzaAwyj7AAAy7LmGiiWE3kHMAAAAAElFTkSuQmCC',
		pants: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPAAAAAQCAYAAAAoEfIQAAAAAXNSR0IArs4c6QAAAMJJREFUaIHt00EOwjAMRFHn/oc2G4qi1JUyY0oX/LerYBx3qkQAAAAAAAAAAAAAAAAAAAAAAAD80Hh6gX+QmRkRMcaw+j7y7ozMzG+c7Zzv7N7pq9vVPKd7vruD8g7lj2uBSqHV4e5HnPPqx7+ivoOajbqvY57V35TfmhHnzlLJzc/vGdv7rzOc/Pp/8UKfujIvdc558SJ+9jcvdJlXdsiliPV5J1vld2dEkVd09r8jr3C6uprTyT6Zv2ufzjfpuK3PF/LModu4wxtyAAAAAElFTkSuQmCC',
	};

	// The palettes are the ones in scripts/crowd.gd, so the player is dressed
	// from the same box of crayons as the crowd walking past.
	const PALETTES = {
		skin: ['#ffe84f', '#ffd49e', '#dea873', '#a8734a', '#6b4730'],
		hair: ['#000000', '#261a14', '#59331a', '#b88c40', '#99999e'],
		shirt: ['#ff0000', '#639bff', '#f2bf33', '#40b366', '#b359cc', '#f2f2f2', '#333340'],
		pants: ['#0073ff', '#306082', '#40404d', '#735940', '#999ea6'],
	};

	// One row per layer. `frame` names the variant key, `color` the tint key.
	const LAYERS = [
		{ name: 'face', label: 'Face', frame: 'face', color: 'skinColor', palette: PALETTES.skin },
		{ name: 'hair', label: 'Hair', frame: 'hair', color: 'hairColor', palette: PALETTES.hair },
		{ name: 'shirt', label: 'Shirt', frame: 'shirt', color: 'shirtColor', palette: PALETTES.shirt },
		{ name: 'pants', label: 'Pants', frame: 'pants', color: 'pantsColor', palette: PALETTES.pants },
	];

	const VARIANTS = 5;
	const CELL = 16;
	const SCALE = 9;
	const STORAGE_KEY = 'godot_character';
	// The Walk animation in custom_person.tscn keys pose 0, 1, 0, 2 every 0.15s.
	const WALK_POSES = [0, 1, 0, 2];
	const WALK_STEP_MS = 150;

	// Matches the player as dressed in scenes/player.tscn.
	const character = {
		face: 0,
		hair: 0,
		shirt: 0,
		pants: 0,
		skinColor: '#ffd49e',
		hairColor: '#000000',
		shirtColor: '#639bff',
		pantsColor: '#306082',
	};

	const creator = document.getElementById('creator');
	const rowsEl = creator.querySelector('.rows');
	const randomButton = document.getElementById('random');
	const playButton = document.getElementById('play');
	const preview = document.getElementById('preview');
	const previewCtx = preview.getContext('2d');

	// Layers are tinted on a 16x16 scratch canvas, then blitted up to preview.
	const scratch = document.createElement('canvas');
	scratch.width = CELL;
	scratch.height = CELL;
	const scratchCtx = scratch.getContext('2d');

	const sheets = {};
	let sheetsReady = false;
	let played = false;
	let downloadsReady = false;
	let starting = false;
	// The doll walks on the spot while being dressed, then stops on pose 0 once
	// Play is pressed -- standing still while the world loads.
	let poseIndex = 0;
	let walkTimer = 0;
	const rowRefs = [];

	function isHexColor(value) {
		return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value);
	}

	function clampFrame(value) {
		const n = Math.floor(Number(value));
		if (!isFinite(n) || n < 0 || n >= VARIANTS) {
			return 0;
		}
		return n;
	}

	function hexToFloats(hex) {
		return [
			parseInt(hex.slice(1, 3), 16) / 255,
			parseInt(hex.slice(3, 5), 16) / 255,
			parseInt(hex.slice(5, 7), 16) / 255,
		];
	}

	function floatsToHex(rgb) {
		if (!Array.isArray(rgb) || rgb.length < 3) {
			return null;
		}
		const parts = rgb.slice(0, 3).map((c) => {
			const v = Math.round(Math.min(1, Math.max(0, Number(c))) * 255);
			return isFinite(v) ? v.toString(16).padStart(2, '0') : '00';
		});
		return '#' + parts.join('');
	}

	// localStorage is user-editable, so every field is checked before it lands.
	function loadSaved() {
		let saved;
		try {
			saved = JSON.parse(window.localStorage.getItem(STORAGE_KEY));
		} catch (err) {
			return;
		}
		if (!saved || typeof saved !== 'object') {
			return;
		}
		LAYERS.forEach((layer) => {
			if (layer.frame in saved) {
				character[layer.frame] = clampFrame(saved[layer.frame]);
			}
			const hex = floatsToHex(saved[layer.color]);
			if (isHexColor(hex)) {
				character[layer.color] = hex;
			}
		});
	}

	function save() {
		const payload = {
			face: character.face,
			hair: character.hair,
			shirt: character.shirt,
			pants: character.pants,
			skinColor: hexToFloats(character.skinColor),
			hairColor: hexToFloats(character.hairColor),
			shirtColor: hexToFloats(character.shirtColor),
			pantsColor: hexToFloats(character.pantsColor),
		};
		try {
			window.localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
		} catch (err) {
			// Private browsing and full quotas are not worth failing over.
		}
		return payload;
	}

	// One tinted layer: draw the frame, multiply a colour through it, then mask
	// back to the sprite's own alpha. That is what Sprite2D.modulate does.
	function drawLayer(sheet, frame, color) {
		const sx = frame * CELL;
		scratchCtx.globalCompositeOperation = 'source-over';
		scratchCtx.clearRect(0, 0, CELL, CELL);
		scratchCtx.drawImage(sheet, sx, 0, CELL, CELL, 0, 0, CELL, CELL);
		scratchCtx.globalCompositeOperation = 'multiply';
		scratchCtx.fillStyle = color;
		scratchCtx.fillRect(0, 0, CELL, CELL);
		scratchCtx.globalCompositeOperation = 'destination-in';
		scratchCtx.drawImage(sheet, sx, 0, CELL, CELL, 0, 0, CELL, CELL);
		scratchCtx.globalCompositeOperation = 'source-over';
		previewCtx.drawImage(scratch, 0, 0, CELL, CELL, 0, 0, CELL * SCALE, CELL * SCALE);
	}

	function drawPreview(pose) {
		poseIndex = pose;
		previewCtx.imageSmoothingEnabled = false;
		previewCtx.clearRect(0, 0, preview.width, preview.height);
		if (!sheetsReady) {
			return;
		}
		const walkOffset = pose * VARIANTS;
		drawLayer(sheets.pants, character.pants + walkOffset, character.pantsColor);
		drawLayer(sheets.shirt, character.shirt, character.shirtColor);
		drawLayer(sheets.shirtskin, character.shirt + walkOffset, character.skinColor);
		drawLayer(sheets.face, character.face, character.skinColor);
		drawLayer(sheets.hair, character.hair, character.hairColor);
	}

	function refresh() {
		rowRefs.forEach((ref) => {
			ref.count.textContent = (character[ref.layer.frame] + 1) + '/' + VARIANTS;
			const current = character[ref.layer.color];
			ref.swatches.forEach((swatch) => {
				swatch.classList.toggle('selected', swatch.dataset.color === current);
			});
			ref.custom.value = current;
		});
		drawPreview(poseIndex);
	}

	function step(layer, delta) {
		const next = (character[layer.frame] + delta + VARIANTS) % VARIANTS;
		character[layer.frame] = next;
		refresh();
	}

	function buildRow(layer) {
		const row = document.createElement('div');
		row.className = 'row';

		const top = document.createElement('div');
		top.className = 'row-top';

		const name = document.createElement('span');
		name.className = 'row-name';
		name.textContent = layer.label;

		const prev = document.createElement('button');
		prev.type = 'button';
		prev.className = 'arrow';
		prev.textContent = '◀';
		prev.setAttribute('aria-label', 'Previous ' + layer.label);
		prev.addEventListener('click', () => step(layer, -1));

		const count = document.createElement('span');
		count.className = 'row-count';

		const next = document.createElement('button');
		next.type = 'button';
		next.className = 'arrow';
		next.textContent = '▶';
		next.setAttribute('aria-label', 'Next ' + layer.label);
		next.addEventListener('click', () => step(layer, 1));

		top.append(name, prev, count, next);

		const swatchRow = document.createElement('div');
		swatchRow.className = 'swatches';

		const swatches = layer.palette.map((hex) => {
			const swatch = document.createElement('button');
			swatch.type = 'button';
			swatch.className = 'swatch';
			swatch.style.backgroundColor = hex;
			swatch.dataset.color = hex;
			swatch.setAttribute('aria-label', layer.label + ' colour ' + hex);
			swatch.addEventListener('click', () => {
				character[layer.color] = hex;
				refresh();
			});
			return swatch;
		});

		const custom = document.createElement('input');
		custom.type = 'color';
		custom.className = 'swatch-custom';
		custom.setAttribute('aria-label', 'Custom ' + layer.label + ' colour');
		custom.addEventListener('input', () => {
			character[layer.color] = custom.value;
			refresh();
		});

		swatchRow.append(...swatches, custom);
		row.append(top, swatchRow);
		rowsEl.appendChild(row);
		rowRefs.push({ layer: layer, count: count, swatches: swatches, custom: custom });
	}

	// Mirrors _spawn_walker in scripts/crowd.gd.
	function randomize() {
		LAYERS.forEach((layer) => {
			character[layer.frame] = Math.floor(Math.random() * VARIANTS);
			character[layer.color] = layer.palette[Math.floor(Math.random() * layer.palette.length)];
		});
		refresh();
	}

	function loadSheets() {
		const names = Object.keys(SHEET_SRC);
		let remaining = names.length;
		names.forEach((name) => {
			const img = new Image();
			img.onload = () => {
				remaining -= 1;
				if (remaining === 0) {
					sheetsReady = true;
					drawPreview(poseIndex);
				}
			};
			img.src = SHEET_SRC[name];
			sheets[name] = img;
		});
	}

	function startWalking() {
		if (walkTimer !== 0) {
			return;
		}
		let index = 0;
		walkTimer = window.setInterval(() => {
			index = (index + 1) % WALK_POSES.length;
			drawPreview(WALK_POSES[index]);
		}, WALK_STEP_MS);
	}

	function stopWalking() {
		window.clearInterval(walkTimer);
		walkTimer = 0;
		drawPreview(0);
	}

	/* --- booting -------------------------------------------------------- */

	// Everything is downloaded and the runtime is initialised, but no game code
	// has run: Engine.init() leaves noInitialRun set, so main is never called.
	function onDownloadsReady() {
		downloadsReady = true;
		if (played) {
			startEngine();
		}
	}

	// Play is what actually boots the game -- this is the first moment any Godot
	// code runs. start() copies the preloaded pack in and calls main, which blocks
	// the main thread for over a second, so hand the browser two frames first: the
	// entering indicator has to be painted and handed to the compositor before the
	// block starts, or it never animates.
	function startEngine() {
		if (starting) {
			return;
		}
		starting = true;
		window.requestAnimationFrame(() => {
			window.requestAnimationFrame(() => {
				engine.start({
					'args': ['--main-pack', mainPack].concat(GODOT_CONFIG['args'] || []),
				}).catch(displayFailureNotice);
			});
		});
	}

	function revealGame() {
		if (!initializing) {
			return;
		}
		initializing = false;
		loader.classList.add('fade-out');
		window.setTimeout(() => {
			loader.remove();
			// GODOT_CONFIG focuses the canvas at startup, behind the overlay.
			const canvas = document.getElementById('canvas');
			if (canvas) {
				canvas.focus();
			}
		}, 250);
	}

	// Play boots the game. Nothing Godot-side has run before this point, so the
	// look is simply left where scripts/appearance.gd will find it on startup:
	// on the window, and in localStorage for the next visit.
	function play() {
		if (played) {
			return;
		}
		played = true;
		window.__pendingCharacter = JSON.stringify(save());

		creator.classList.add('busy');
		stopWalking();

		// Pressed before the downloads finished? Boot the moment they land.
		if (downloadsReady) {
			startEngine();
		}

		// Only arm the failsafe once the engine has actually been told to go, so
		// an early Play on a slow line still waits as long as it needs, but a
		// silent bridge never strands the visitor on the overlay.
		let failsafe = 0;
		const poll = window.setInterval(() => {
			if (window.__gameStarted === true) {
				window.clearInterval(poll);
				window.clearTimeout(failsafe);
				revealGame();
			} else if (starting && failsafe === 0) {
				failsafe = window.setTimeout(revealGame, 15000);
			}
		}, 100);
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		loader.classList.add('hidden');
		statusNotice.style.display = 'block';
		initializing = false;
	}

	/* --- start --------------------------------------------------------- */

	LAYERS.forEach(buildRow);
	loadSaved();
	refresh();
	loadSheets();
	startWalking();
	randomButton.addEventListener('click', randomize);
	playButton.addEventListener('click', play);

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		// Downloading starts now, in parallel with the visitor dressing up. This
		// is deliberately not startGame(): init() fetches and compiles the wasm
		// and brings up the runtime, preloadFile() fetches the pack, and neither
		// runs a line of game code. The game only boots when Play calls start().
		Promise.all([
			engine.init(executable),
			engine.preloadFile(mainPack, mainPack),
		]).then(onDownloadsReady, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
