<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Hanyang Liu</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #17171a;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* --- loading screen ------------------------------------------------- */

#loader {
	position: fixed;
	inset: 0;
	background-color: #17171a;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1.5rem;
	opacity: 1;
	transition: opacity 250ms linear;
	z-index: 2;
}

#loader.fade-out {
	opacity: 0;
}

#loader.hidden {
	display: none;
}

.blocks {
	display: flex;
	gap: 8px;
}

.blocks > div {
	width: 14px;
	height: 14px;
	background-color: #3a3a42;
	animation: block-pulse 1s steps(2, end) infinite;
}

.blocks > div:nth-child(2) { animation-delay: 0.125s; }
.blocks > div:nth-child(3) { animation-delay: 0.25s; }
.blocks > div:nth-child(4) { animation-delay: 0.375s; }

@keyframes block-pulse {
	0%   { background-color: #3a3a42; transform: translateY(0); }
	50%  { background-color: #d8d8e0; transform: translateY(-6px); }
	100% { background-color: #3a3a42; transform: translateY(0); }
}

.label {
	font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	font-size: 0.75rem;
	letter-spacing: 0.2em;
	text-transform: uppercase;
	color: #8a8a96;
	display: flex;
	gap: 0.75em;
}

.percent {
	color: #d8d8e0;
}

#loader.unknown-total .percent {
	display: none;
}

.bar {
	width: min(240px, 60vw);
	height: 10px;
	background-color: #26262c;
	overflow: hidden;
}

.bar-fill {
	width: 0;
	height: 100%;
	background-color: #d8d8e0;
}

#loader.unknown-total .bar-fill {
	width: 33%;
	animation: bar-sweep 1.2s steps(8, end) infinite;
}

@keyframes bar-sweep {
	0%   { transform: translateX(-100%); }
	100% { transform: translateX(300%); }
}

@media (prefers-reduced-motion: reduce) {
	.blocks > div,
	#loader.unknown-total .bar-fill {
		animation: none;
	}
	.blocks > div {
		background-color: #8a8a96;
	}
}

/* --- failure notice -------------------------------------------------- */

#status-notice {
	position: fixed;
	left: 0;
	right: 0;
	top: 50%;
	transform: translateY(-50%);
	display: none;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 3;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="loader">
			<div class="blocks">
				<div></div>
				<div></div>
				<div></div>
				<div></div>
			</div>
			<div class="label">
				<span class="label-text">loading</span>
				<span class="percent">0%</span>
			</div>
			<div class="bar">
				<div class="bar-fill"></div>
			</div>
		</div>
		<div id="status-notice"></div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2426180,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loader = document.getElementById('loader');
	const labelText = loader.querySelector('.label-text');
	const percent = loader.querySelector('.percent');
	const barFill = loader.querySelector('.bar-fill');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let lastPercent = 0;

	function setProgress(current, total) {
		if (current > 0 && total > 0) {
			loader.classList.remove('unknown-total');
			const value = Math.min(100, Math.floor((current / total) * 100));
			if (value < lastPercent) {
				return;
			}
			lastPercent = value;
			percent.textContent = value + '%';
			barFill.style.width = value + '%';
			if (value >= 100) {
				labelText.textContent = 'starting';
			}
		} else {
			loader.classList.add('unknown-total');
		}
	}

	function hideLoader() {
		if (!initializing) {
			return;
		}
		initializing = false;
		loader.classList.add('fade-out');
		setTimeout(() => loader.remove(), 250);
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		loader.classList.add('hidden');
		statusNotice.style.display = 'block';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				setProgress(current, total);
			},
		}).then(hideLoader, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
